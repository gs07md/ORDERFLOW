<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OrderFlow — Shree Giriraj Auto Parts</title>
<style>
  :root{
    --bg: #F0F2F6;
    --bg-panel: #FFFFFF;
    --bg-raised: #F2F4F7;
    --line: #E1E4EA;
    --text: #14161B;
    --text-dim: #6B7280;
    --navy: #101A33;
    --navy-2: #1B2A4E;
    --accent: #2F5FDE;
    --accent-dim: #E8EEFD;
    --ok: #12946A;
    --ok-bg: #E4F6EF;
    --bad: #D6433D;
    --bad-bg: #FCEAEA;
    --wait-bg: #FEF0D8;
    --wait: #B4720F;
    --radius: 12px;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  body{ padding-bottom:84px; min-height:100vh; }
  h1,h2,h3{ margin:0; font-weight:600; }
  .app-header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    padding:16px 16px 14px;
    box-shadow:0 2px 10px rgba(16,26,51,.18);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:34px; height:34px; border-radius:9px; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-weight:700; color:#FFFFFF; font-size:15px; flex:none; border:1px solid rgba(255,255,255,.18); }
  .brand-name{ font-size:15.5px; font-weight:600; letter-spacing:.2px; color:#FFFFFF; }
  .brand-sub{ font-size:11.5px; color:rgba(255,255,255,.62); margin-top:1px; }

  /* ---- which day are we looking at (ported from the PC's date-bar) ---- */
  .datebar{ display:flex; gap:7px; margin-top:11px; align-items:center; }
  .datebar .db{
    flex:1; min-width:0; padding:8px 6px; font-size:12.5px; font-weight:600;
    font-family:inherit; color:#FFFFFF; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22); border-radius:8px; cursor:pointer;
  }
  .datebar .db.active{ background:#FFFFFF; color:var(--navy); border-color:#FFFFFF; }
  .datebar input[type=date]{
    flex:1.15; min-width:0; padding:7px 8px; font-size:12.5px; font-family:inherit;
    color:#FFFFFF; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22); border-radius:8px;
  }
  .oldday{
    background:#FFF8E6; border:1px solid #F0DCA8; color:#7A5B12;
    padding:10px 12px; border-radius:10px; font-size:12.5px; line-height:1.45;
    margin-bottom:12px;
  }

  main{ padding:14px 16px 8px; max-width:640px; margin:0 auto; }

  /* ---- Order list ---- */
  .order-card{
    background:var(--bg-panel); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:var(--radius);
    padding:14px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
    cursor:pointer; box-shadow:0 1px 3px rgba(16,24,40,.05); transition:box-shadow .15s, transform .1s;
  }
  .order-card:active{ background:var(--bg-raised); transform:scale(.995); }
  .order-card .no{ font-family:var(--mono); font-size:12.5px; color:var(--text-dim); letter-spacing:.1px; }
  .order-card .title{ font-size:15px; font-weight:650; margin-top:2px; }
  .order-card .meta{ font-size:12.5px; color:var(--text-dim); margin-top:3px; }
  .order-card .right{ margin-left:auto; text-align:right; flex:none; }
  .chevron{ color:var(--text-dim); font-size:18px; }

  .pill{
    display:inline-block; padding:4px 10px; border-radius:100px; font-size:11px; font-weight:650;
    letter-spacing:.2px;
  }
  .pill.pending{ background:var(--wait-bg); color:var(--wait); }
  .pill.checking{ background:var(--accent-dim); color:var(--accent); }
  .pill.ready{ background:var(--ok-bg); color:var(--ok); }
  .pill.billed{ background:#EDEEF0; color:var(--text-dim); }
  .order-card:has(.pill.pending){ border-left-color:var(--wait); }
  .order-card:has(.pill.checking){ border-left-color:var(--accent); }
  .order-card:has(.pill.ready){ border-left-color:var(--ok); }
  .order-card:has(.pill.billed){ border-left-color:var(--line); }

  .section-label{ font-size:12px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; margin:18px 2px 8px; }

  /* ---- item rows (packing check) ---- */
  .item-row{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 13px; margin-bottom:9px; transition:background .15s, border-color .15s;
    box-shadow:0 1px 3px rgba(16,24,40,.05);
  }
  .item-row.mismatch{ background:var(--bad-bg); border-color:#F3B9B6; }
  .item-top{ display:flex; justify-content:space-between; gap:10px; }
  .item-code{ font-family:var(--mono); font-size:15.5px; font-weight:800; color:var(--accent); }
  .item-desc{ font-size:14px; margin-top:2px; line-height:1.35; }
  .item-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:11px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:10.5px; color:var(--text-dim); letter-spacing:.3px; }
  /* Read-only cells and typed-in cells are drawn EXACTLY the same -- same
     box, same height, same type -- so a row reads as four equal boxes
     instead of two bits of loose text beside two grey boxes. */
  .field .readonly, .field input{
    border:1px solid var(--line); border-radius:8px;
    padding:9px 10px; font-size:15px; font-family:var(--mono);
    width:100%; box-sizing:border-box; min-height:40px; line-height:20px;
  }
  .field .readonly{ background:transparent; color:var(--text); font-weight:700; }
  .field input{ background:var(--bg-raised); color:var(--text); }
  .item-row.mismatch .field input{ border-color:var(--bad); }
  .field input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  .field input::placeholder{ color:var(--text-dim); opacity:.55; }
  .mismatch-tag{ font-size:10.5px; color:var(--bad); margin-top:8px; font-weight:600; }
  /* An item a Sale bill has already taken. Shown, not hidden, so it is
     obvious WHY it is not to be picked -- and clearly out of the way. */
  .item-row.already-billed{ background:var(--ok-bg); border-color:#B9DFC4; }
  .item-row.already-billed .item-desc,
  .item-row.already-billed .item-grid{ opacity:.5; }
  /* Shown on the ORDER CARD itself, so "this is already on a bill in
     Value-FAS" is visible in the list without opening the order. */
  .card-billed{ display:inline-block; font-size:11px; font-weight:800; letter-spacing:.2px;
    color:var(--ok); background:var(--ok-bg); border:1px solid #B9DFC4;
    border-radius:999px; padding:2px 9px; margin-top:5px; }
  .order-card.has-billed{ border-left:4px solid var(--ok); }
  .billed-tag{ display:inline-block; font-size:11px; font-weight:800; letter-spacing:.3px;
    color:var(--ok); background:#fff; border:1px solid #B9DFC4; border-radius:999px;
    padding:3px 10px; margin-top:6px; }

  /* ---- dispatcher item table (16-09-2026) ----
     The dispatcher was reading the same four-box card the picker fills
     in, one card per item, which on a twenty-line order is a lot of
     scrolling to answer one question: what is different? A table answers
     that in one look. */
  .dwrap{ overflow-x:auto; -webkit-overflow-scrolling:touch;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-panel); }
  .dtable{ width:100%; border-collapse:collapse; table-layout:fixed; }
  .dtable col.q, .dtable col.r{ width:74px; }
  .cdline{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .ordline{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .ordline b{ color:var(--text); font-family:var(--mono); }
  .dtable th{ font-size:10px; letter-spacing:.4px; text-transform:uppercase;
    color:var(--text-dim); font-weight:700; text-align:left; padding:8px 7px;
    background:var(--bg-raised); border-bottom:1px solid var(--line); white-space:nowrap; }
  .dtable th.n{ text-align:right; }
  .dtable td{ padding:8px 7px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
  .dtable tr:last-child td{ border-bottom:none; }
  .dtable td.n{ text-align:right; font-family:var(--mono); white-space:nowrap; }
  .dtable .cd{ font-family:var(--mono); font-weight:800; color:var(--accent); font-size:13px; }
  .dtable .ds{ font-size:11.5px; color:var(--text-dim); line-height:1.3; margin-top:1px; }
  .dtable .lc{ font-size:11px; color:var(--text-dim); font-family:var(--mono);
    white-space:nowrap; margin-top:2px; }
  .dtable input{ width:100%; min-width:54px; box-sizing:border-box; padding:7px 6px;
    border:1px solid var(--line); border-radius:7px; background:var(--bg-raised);
    font-family:var(--mono); font-size:14px; text-align:right; color:var(--text); }
  .dtable input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  .dtable input:disabled{ opacity:.45; }

  /* THE COLOURS EACH MEAN ONE THING, AND ONLY ONE.
       yellow  = the RATE is not the stock rate
       red bar = the QUANTITY is not what was ordered
       red row = the item was not supplied at all (qty 0)
       green   = a bill in Value-FAS has already taken it
     Two can be true at once, so they are separate marks rather than one
     colour that has to mean several things. */
  .dtable tr.rate-diff{ background:var(--wait-bg); }
  .dtable tr.qty-diff td:first-child{ box-shadow: inset 3px 0 0 var(--bad); }
  .dtable tr.gone{ background:var(--bad-bg); }
  .dtable tr.gone .cd, .dtable tr.gone .ds{ text-decoration:line-through; opacity:.55; }
  .dtable tr.billed-row{ background:var(--ok-bg); }
  .dtable .who{ font-size:10.5px; color:var(--text-dim); margin-top:3px; line-height:1.3; }
  .dtable .who b{ color:var(--text); font-weight:800; }

  .delbtn{ border:1px solid var(--line); background:var(--bg-panel); color:var(--bad);
    border-radius:7px; padding:6px 10px; font-size:11.5px; font-weight:800; cursor:pointer;
    line-height:1.2; white-space:nowrap; margin-top:7px; }
  .delbtn:active{ background:var(--bad-bg); }
  .delbtn.undo{ color:var(--text-dim); }
  .delbtn:disabled{ opacity:.3; }

  .legend{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11px; color:var(--text-dim);
    margin:9px 2px 10px; align-items:center; }
  .legend i{ width:11px; height:11px; border-radius:3px; display:inline-block;
    margin-right:4px; vertical-align:-1px; border:1px solid rgba(0,0,0,.10); }

  /* one pair of marks, used on every screen, same colours everywhere */
  .mk{ font-weight:800; font-size:13.5px; }
  .mk.yes{ color:var(--ok); }
  .mk.no{ color:var(--bad); }

  /* ---- who this order is given to ---- */
  .assign{ display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:wrap; }
  .assign label{ font-size:11px; color:var(--text-dim); }
  .assign select{ font-size:12px; padding:5px 7px; border:1px solid var(--line);
    border-radius:7px; background:var(--bg-panel); color:var(--text); max-width:160px; }
  .who-chip{ display:inline-block; font-size:11px; font-weight:800; color:var(--accent);
    background:var(--accent-dim); border-radius:999px; padding:2px 9px; }
  .who-chip.none{ color:var(--text-dim); background:var(--bg-raised); }
  .who-chip.done{ color:var(--ok); background:var(--ok-bg); }

  /* ---- one order, more than one pair of hands ---- */
  .split-list{ display:flex; flex-direction:column; gap:8px; margin:8px 0 14px; }
  .split-row{ display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg-raised); }
  .split-row input[type=checkbox]{ width:20px; height:20px; flex:none; }
  .split-row .nm{ font-weight:700; flex:1; }
  .split-row .cnt{ font-family:var(--mono); font-size:12px; color:var(--text-dim); }
  .split-preview{ font-size:12.5px; color:var(--text-dim); margin-bottom:12px; line-height:1.5; }
  .split-preview b{ color:var(--text); }
  .prog{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800;
    border-radius:999px; padding:2px 9px 2px 7px; color:var(--accent); background:var(--accent-dim); }
  .prog.full{ color:var(--ok); background:var(--ok-bg); }
  .prog i{ width:34px; height:5px; border-radius:3px; background:rgba(0,0,0,.10); position:relative; display:inline-block; }
  .prog i b{ position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:currentColor; }
  .own{ display:inline-block; font-size:10px; font-weight:800; color:var(--accent);
    background:var(--accent-dim); border-radius:999px; padding:1px 7px; margin-left:5px; vertical-align:1px; }
  .btn-split{ margin-top:0; padding:6px 10px; font-size:12px; border:1px solid var(--line);
    border-radius:7px; background:var(--bg-panel); color:var(--accent); font-weight:800; cursor:pointer; }

  .toast{ position:fixed; left:50%; bottom:78px; transform:translateX(-50%);
    background:var(--navy); color:#fff; font-size:13px; padding:10px 16px;
    border-radius:999px; z-index:60; box-shadow:0 6px 20px rgba(16,24,40,.28);
    max-width:88%; text-align:center; }

  /* ---- recheck table ---- */
  .recheck-row{
    display:grid; grid-template-columns: 1fr auto auto; gap:8px; align-items:center;
    padding:10px 12px; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .recheck-row.mismatch{ background:var(--bad-bg); }
  .recheck-row.rate-diff{ background:var(--wait-bg); }
  .recheck-row .who{ font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .recheck-row .desc{ line-height:1.3; }
  .recheck-row .code{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  .recheck-row .colhead{ font-size:10.5px; color:var(--text-dim); text-align:right; }
  .recheck-row .num{ font-family:var(--mono); text-align:right; min-width:64px; }
  .recheck-row .num.diff{ color:var(--bad); font-weight:700; }

  .summary-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-top:14px;
  }
  .summary-line{ display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--text-dim); }
  .summary-line.total{ color:var(--text); font-weight:700; font-size:16px; border-top:1px solid var(--line); margin-top:6px; padding-top:10px; }
  .summary-line .val{ font-family:var(--mono); }

  /* ---- buttons ---- */
  .btn{
    display:block; width:100%; text-align:center; padding:14px; border-radius:var(--radius);
    font-size:15px; font-weight:600; border:none; cursor:pointer; margin-top:14px;
  }
  .btn-primary{ background:var(--accent); color:#FFFFFF; }
  .btn-primary:active{ opacity:.85; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn:disabled{ opacity:.4; }

  .topbar{ display:flex; align-items:center; gap:10px; }
  .backbtn{ background:none; border:none; color:#FFFFFF; font-size:20px; padding:2px 6px 2px 0; cursor:pointer; }

  /* ---- bottom tab nav ---- */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--bg-panel); border-top:1px solid var(--line);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim); font-size:11.5px;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; cursor:pointer;
  }
  nav.tabbar button .ico{ font-size:19px; }
  nav.tabbar button.active{ color:var(--accent); }

  .empty{ text-align:center; color:var(--text-dim); font-size:13.5px; padding:40px 20px; }
  .fab-note{ font-size:11.5px; color:var(--text-dim); text-align:center; margin:16px 2px 4px; line-height:1.5; }
.user-name-input{ width:100%; margin-top:5px; padding:9px 10px; font-size:15px;
  font-weight:600; border:1px solid var(--line); border-radius:8px;
  background:var(--bg-panel); color:var(--text); }
.loc-line{ font-size:15.5px; font-weight:800; color:var(--accent); text-align:left; margin:6px 0 0; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.loc-stock{ font-family:var(--mono); font-size:13px; font-weight:700; color:var(--text-dim); background:var(--bg-panel); border:1px solid var(--line); border-radius:6px; padding:2px 9px; }

  .status-banner{
    background:var(--wait-bg); border:1px solid #F0DFA3; color:var(--wait); font-size:11.5px;
    border-radius:8px; padding:8px 11px; margin-bottom:14px; line-height:1.5;
  }
  .hidden{ display:none !important; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; display:flex; align-items:flex-end;
  }
  .modal{
    background:var(--bg-panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0;
    width:100%; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:80vh; overflow:auto;
  }
  .modal h3{ margin-bottom:12px; }
  .modal .field{ margin-bottom:10px; }
  .modal .field label{ margin-bottom:3px; }
  .modal .field input{ font-family:var(--sans); font-size:14.5px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* ---- role picker ---- */
  .role-card{
    background:var(--bg-panel); border:2px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:12px; cursor:pointer; text-align:center;
  }
  .role-card:active{ border-color:var(--accent); background:var(--accent-dim); }
  .role-card .role-title{ font-size:16px; font-weight:700; margin-bottom:4px; }
  .role-card .role-desc{ font-size:12.5px; color:var(--text-dim); }
  .role-badge{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.3px;
    color:#FFFFFF; background:rgba(255,255,255,.16); padding:4px 10px; border-radius:100px;
    cursor:pointer; border:1px solid rgba(255,255,255,.2);
  }
  .status-chip{
    flex:none; font-size:12px; font-weight:600; padding:7px 13px; border-radius:100px;
    border:1px solid var(--line); cursor:pointer; white-space:nowrap;
  }
</style>
</head>
<body>

<header class="app-header">
  <div id="headerContent">
    <div class="brand">
      <div class="mark">GA</div>
      <div>
        <div class="brand-name">OrderFlow</div>
        <div class="brand-sub">Shree Giriraj Auto Parts — order → pack check → bill</div>
      </div>
    </div>
  </div>
</header>

<main id="main"></main>

<nav class="tabbar">
  <button data-tab="orders" class="active"><span class="ico">▤</span>Orders</button>
</nav>

<div id="modalRoot"></div>

<script>
/* =========================================================================
   DATA LAYER -- Supabase (Postgres + REST via PostgREST).
   Swapped from Firestore because the free Firestore tier counts every
   single document read against a small daily quota, which a polling
   app like this blows through in hours. Supabase's free tier has no
   such per-read quota -- just storage/bandwidth ceilings this app is
   nowhere close to.
   ========================================================================= */
const SUPABASE_URL = "https://mzzieomklvphwfwyiqjn.supabase.co";
const SUPABASE_KEY = "sb_publishable_NUY-qCvUPIUoShzYZdaqZQ_c3z-Olco";
const SB_HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": `Bearer ${SUPABASE_KEY}`,
  "Content-Type": "application/json"
};
const FIREBASE_CONFIGURED = true; // kept as the flag name the rest of the app checks

function orderToRow(o){
  return {
    id: o.id, order_no: o.orderNo, party: o.party, ac_code: o.acCode || null,
    location: o.location || null, order_date: o.date, status: o.status,
    fas_entry_started: !!o.fasEntryStarted, items: o.items,
    // Who this order has been given to for picking. Null = nobody yet.
    assigned_to: o.assignedTo || null
  };
}
function sortOrders(list){
  // Supabase returns rows in whatever order the table hands them back, so
  // the list came out jumbled -- 10033, 10037, 10038, 10039, then 10093,
  // 10095. Sorted by order number here, ONCE, so every screen shows them
  // in line.
  return (list || []).slice().sort((a, b) => {
    const na = Number(a.orderNo), nb = Number(b.orderNo);
    if(Number.isFinite(na) && Number.isFinite(nb) && na !== nb) return na - nb;
    return String(a.orderNo).localeCompare(String(b.orderNo), undefined, {numeric:true});
  });
}

// -------- WHICH DAY ARE WE LOOKING AT (ported from the PC copy) --------
// Bill Maker has had Today / Yesterday / any date from the start.
// OrderFlow only ever showed today, so a mistake made yesterday could
// not be checked from the phone: "mare order flow ma pn date vise joi
// same as bill maker ni jm ke su bhul kri kale teh check kri sakay".
let viewDay = 'today';        // 'today' | 'yesterday' | 'YYYY-MM-DD'

function localYmd(d){
  // The PHONE'S OWN date. toISOString is UTC, and India is 5.5h ahead,
  // so before 5:30am it asked for YESTERDAY and the morning's orders
  // looked like they had not arrived.

async function pushAllToSupabase(orders){
  for(const order of orders){
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
        method: 'POST',
        headers: {...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates'},
        body: JSON.stringify(orderToRow(order))
      });
    }catch(e){ console.error('supabase push failed', order.id, e); }
  }
}

async function pullFromSupabase(){
  if(!FIREBASE_CONFIGURED) return null;
  try{
    const day = chosenDate();
    // Filter by the chosen day server-side -- cheaper than pulling every
    // historical order and filtering in the browser.
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?order_date=eq.${day}&select=*`, {headers: SB_HEADERS});
    const rows = await res.json();
    if(!Array.isArray(rows)) return null;
    return sortOrders(rows.map(rowToOrder));
  }catch(e){ console.error('supabase pull failed', e); return null; }
}

// Poll for changes from other devices (Value-FAS sync script, other phones)
function startLiveSync(){
  if(!FIREBASE_CONFIGURED) return;
  setInterval(async ()=>{
    const remote = await pullFromSupabase();
    // Refresh stock (item location, qty, rate) on the SAME cycle as
    // orders -- so location data is never more stale than the orders
    // themselves. Runs alongside the order pull, not gated behind the
    // old 15-min cache.
    preloadUsers();
    fetchAllStock().then(fresh => {
      stockCache = fresh;
      try{ localStorage.setItem('orderflow_stock_cache', JSON.stringify({ts: Date.now(), data: fresh})); }catch(e){}
    }).catch(()=>{});
    if(remote === null) return;
    // Supabase is the source of truth. Replace local orders with the
    // remote list every poll (so deletions/cleanups on the server side
    // actually take effect on every phone) -- except the ONE order the
    // person currently has open, which is kept local so a background
    // poll never clobbers input they're actively typing.
    const newOrders = sortOrders(remote.map(r => (r.id === currentOrderId
      ? (orders.find(o => o.id === r.id) || r)
      : r)));
    const nextJson = JSON.stringify(newOrders);
    if(nextJson === JSON.stringify(orders)) return;   // nothing changed -- don't repaint
    orders = newOrders;
    // Only today's list is worth keeping for the next visit; caching an
    // old day's orders would flash them on next open before the pull
    // lands -- the kind of thing that gets picked into by mistake.
    if(viewingToday()) localStorage.setItem('orderflow_orders_v2', nextJson);
    if(!currentOrderId) render();
  }, 3000);
}

/* -------- the phone's Back button --------
   Until now Back closed the whole app. On a packing screen that means
   losing your place mid-order, which is exactly when it is worst. A
   history entry is kept while anything is open, so Back walks back OUT
   of it instead of out of the app. At the top of the app it asks once
   before letting go. */
let _atTopSince = 0;
function armBack(){
  try{ history.pushState({of:1}, ''); }catch(e){}
}
function goBack(){
  if(currentOrderId){ currentOrderId = null; pickerIdx = 0; render(); return true; }
  if(activeTab !== 'orders'){
    activeTab = 'orders';
    [...tabbar.children].forEach(b=>b.classList.toggle('active', b.dataset.tab === 'orders'));
    render();
    return true;
  }
  return false;
}
window.addEventListener('popstate', ()=>{
  if(goBack()){ armBack(); return; }
  // Nothing left to go back to. One press warns, a second within three
  // seconds is allowed through and closes the app.
  const now = Date.now();
  if(now - _atTopSince < 3000) return;    // let it go
  _atTopSince = now;
  toast('App band karva mate fari Back dabavo');
  armBack();
});

async function doPhoneLogin(){
  const raw = document.getElementById('login-phone').value.trim();
  const phone = raw.replace(/\D/g, '');
  if(phone.length < 10){ alert('Sahi 10-digit mobile number nakho'); return; }

  // Nobody types their own name any more. The CEO puts it against the
  // number in Manage Users, and it is simply read back here.
  const existing = await getUser(phone);
  const savedName = (existing && existing.name ? String(existing.name) : '').trim();

  if(existing){
    if(!savedName){
      alert('Aa number mate naam save nathi thayu.\n\nCEO ne kaho: Manage Users '
            + 'ma ' + phone + ' ni same naam nakhe.');
      return;
    }
    currentRole = existing.role;
    currentPhone = phone;
    currentName = savedName;
  } else {
    const noUsersYet = !(await anyUsersExist());
    if(noUsersYet){
      // Bootstrap: the very first person in becomes CEO. There is no CEO
      // yet to name them, so the number stands in until they set their
      // own name in Manage Users.
      await setUser(phone, 'ceo', phone);
      currentRole = 'ceo';
      currentPhone = phone;
      currentName = phone;
    } else {
      alert('Aa number register nathi thayu. CEO ne kaho tamne "Manage Users" thi umerva mate.');
      return;
    }
  }
  localStorage.setItem('orderflow_role', currentRole);
  localStorage.setItem('orderflow_phone', currentPhone);
  localStorage.setItem('orderflow_name', currentName);
  render();
}

let stockCache = null;

async function fetchAllStock(){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/stock?select=*`, {
      headers: {...SB_HEADERS, 'Range': `${from}-${from + pageSize - 1}`}
    });
    const rows = await res.json();
    if(!Array.isArray(rows) || rows.length === 0) break;
    all.push(...rows.map(r => ({code: r.code, name: r.name, qty: r.qty, rate: r.rate, minQty: r.min_qty, location: r.location})));
    if(rows.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

      <span class="role-badge" onclick="switchRole()">${currentRole==='picker'?'PICKER':currentRole==='ceo'?'CEO':'DISPATCHER'} ⇄</span>
    </div>

      <button type="button" class="db ${viewDay==='today'?'active':''}" onclick="pickDay('today')">Today</button>
      <button type="button" class="db ${viewDay==='yesterday'?'active':''}" onclick="pickDay('yesterday')">Yesterday</button>

    </div>`;

  if(currentRole === 'ceo'){
    tabbar.querySelector('[data-tab="users"]')?.remove();

    usersBtn.dataset.tab = 'users';
    usersBtn.innerHTML = '<span class="ico">⚙</span>Manage Users';
    tabbar.insertBefore(usersBtn, tabbar.lastElementChild.nextSibling);
  }

  if(orders.length === 0){
    main.innerHTML = (viewingToday()
      ? ''
      : `<div class="oldday"><b>${prettyDate(chosenDate())}</b> nu juo cho — aaj nu nahi.
           <span style="text-decoration:underline; cursor:pointer;" onclick="pickDay('today')">Aaj par pacha jao</span></div>`)
      + `<div class="empty">${viewingToday()
            ? 'Koi order nathi. Value-FAS ma navi order banavta j apoap aavi jashe.'
            : prettyDate(chosenDate()) + ' na divase koi order nathi.'}</div>`;
    return;
  }

  const isCeo = currentRole === 'ceo';
  const canAssign = currentRole === 'ceo' || currentRole === 'dispatcher';

  // A PICKER IS HANDED WORK, NOT THE WHOLE DAY.
  const mine = (currentRole === 'picker')
    ? orders.filter(o => (o.items || []).some(it => String(itemOwner(o, it) || '') === String(currentPhone || '')))
    : orders;

  if(currentRole === 'picker' && mine.length === 0){
    main.innerHTML = (viewingToday() ? '' :
        `<div class="oldday"><b>${prettyDate(chosenDate())}</b> nu juo cho.
           <span style="text-decoration:underline; cursor:pointer;" onclick="pickDay('today')">Aaj par pacha jao</span></div>`)
      + `<div class="empty">Tamne ${viewingToday() ? '' : prettyDate(chosenDate()) + ' na divase '}koi order apayo nathi.</div>`;
    return;
  }

  const rows = mine.map(o=>{
    const total = o.items.length;
    const mismatches = o.items.filter(it => it.aqty != null && (Number(it.aqty)!==Number(it.oqty) || Number(it.arate)!==Number(mrpOf(it)))).length;
    // How many of this order's items a Sale bill in Value-FAS has already
    // taken. Put on the card so nobody has to open the order to find out.
    const billedCount = o.items.filter(it => it.billed).length;
    const allBilled = billedCount > 0 && billedCount === total;
    const showCheckbox = isCeo && o.status === 'ready';
    return `
      <div class="order-card ${billedCount?'has-billed':''}" data-status="${o.status}" data-search="${(o.orderNo+' '+o.party+' '+(o.location||'')+' '+o.items.map(it=>it.code).join(' ')).toLowerCase()}" onclick="goToOrder('${o.id}')">
        ${showCheckbox ? `<input type="checkbox" class="batch-bill-check" data-order-id="${o.id}" onclick="event.stopPropagation(); updateBatchBillBar();" style="width:20px; height:20px; flex:none; margin-right:2px;">` : ''}
        <div>
          <div class="no">${o.orderNo}${o.location ? ' · '+o.location : ''}${o.date ? ' · '+o.date : ''}</div>
          <div class="title">${o.party}</div>
          <div class="meta">${total} item${total>1?'s':''}${(!currentRole || currentRole!=='picker') && mismatches ? ' · '+mismatches+' mismatch'+(mismatches>1?'es':'') : ''}</div>
          ${billedCount ? `<div class="card-billed">&#10003; ${allBilled
              ? 'VALUE-FAS MA BILL BANI GAYU — na kadhso'
              : billedCount + ' / ' + total + ' item bill ma aavi gaya'}</div>` : ''}
          ${(() => {
            const who = pickedByNames(o);
            const bits = [];
            if(currentRole !== 'picker'){
              const prog = ownerProgress(o);
              if(prog.length){
                // "Raju 12/35 · Suresh 0/35" with a little bar each --
                // who has this order, and how far each of them is.
                for(const pr of prog){
                  const pct = pr.total ? Math.round(100 * pr.done / pr.total) : 0;
                  bits.push(`<span class="prog ${pr.done === pr.total ? 'full' : ''}">&#128100; ${esc(pr.name)} ${pr.done}/${pr.total}<i><b style="width:${pct}%"></b></i></span>`);
                }
              } else if(stillToPick(o)){
                bits.push(`<span class="who-chip none">koi ne apayo nathi</span>`);
              }
            }
            if(who.length){
              bits.push(`<span class="who-chip done">&#10003; kadhyu: ${esc(who.join(', '))}</span>`);
            }
            return bits.length
              ? `<div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;">${bits.join('')}</div>`
              : '';
          })()}
          ${canAssign ? assignControl(o) : ''}
        </div>
        <div class="right">
          <span class="pill ${statusPillClass(o.status)}">${statusLabel(o.status)}</span>
        </div>
        <div class="chevron">›</div>
      </div>`;
  }).join('');

  // A count on screen, so "only a few showing" is obviously a filter or a
  // scroll position -- not the list having failed to load.
  // Counted over what this person can actually SEE. A picker shown one
  // card under a chip reading "All (9)" would reasonably think eight
  // cards had failed to load.
  const statusCounts = {pending:0, checking:0, ready:0, packed:0, billed:0};
  mine.forEach(o => { if(statusCounts[o.status]!==undefined) statusCounts[o.status]++; });
  const filterChips = ['all','pending','checking','ready','packed','billed'].map(s => {
    const label = s==='all' ? `All (${mine.length})` : `${statusLabel(s)} (${statusCounts[s]||0})`;
    return `<button class="status-chip" data-status-filter="${s}" onclick="setOrderStatusFilter('${s}')">${label}</button>`;
  }).join('');

  main.innerHTML = `
    ${viewingToday() ? '' : `<div class="oldday">
      <b>${prettyDate(chosenDate())}</b> na order juo cho — aaj na nahi. Ahiya
      badlo karsho toh e <b>e j divas</b> na order ma jashe.
      <span style="text-decoration:underline; cursor:pointer;" onclick="pickDay('today')">Aaj par pacha jao</span>
    </div>`}
    <div class="field" style="margin-bottom:10px;">
      <input id="order-search" placeholder="Order no, party, location ya item code search karo..." oninput="filterOrderList()"
        style="width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; font-size:15px;">
    </div>
    <div id="status-chip-row" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;">${filterChips}</div>
    ${isCeo ? `<div id="batch-bill-bar" class="hidden" style="display:none; align-items:center; gap:10px; background:var(--accent-dim); border-radius:8px; padding:10px 12px; margin-bottom:12px;">
      <span id="batch-bill-count" style="font-size:13px; font-weight:600; color:var(--accent);">0 order pasand karya</span>
      <button class="btn btn-primary" style="margin:0; width:auto; padding:8px 16px;" onclick="generateBatchBills()">Bill Maker ma mokalo</button>
    </div>` : ''}
    <div class="section-label">${viewingToday() ? "Today's orders" : prettyDate(chosenDate()) + ' na order'}</div>
    <div id="order-list-rows">${rows}</div>
    <div class="fab-note">Order Value-FAS mathi apoap aave che. Yaadi dar 3 second e taji thay che.</div>`;
  updateStatusChipStyles();
}

function updateBatchBillBar(){
  const bar = document.getElementById('batch-bill-bar');
  if(!bar) return;
  const checked = document.querySelectorAll('.batch-bill-check:checked').length;
  bar.style.display = checked > 0 ? 'flex' : 'none';
  const countEl = document.getElementById('batch-bill-count');
  if(countEl) countEl.textContent = `${checked} order pasand karya`;
}

function generateBatchBills(){
  // Hands the picked orders to Bill Maker. It does NOT make a bill --
  // the bill is made only from Bill Maker's own "Make Bills" button.
  const ids = [...document.querySelectorAll('.batch-bill-check:checked')].map(c => c.dataset.orderId);
  if(ids.length === 0) return;
  if(!confirm(`${ids.length} order Bill Maker ma mokalva che?\n\nBill ahiya nai bane — Bill Maker ma select karsho tyare j banse.`)) return;
  ids.forEach(id => {
    const o = orders.find(x => x.id === id);
    if(o && o.status === 'ready'){
      o.status = 'packed';
      o.packedAt = new Date().toISOString();
    }
  });
  DB.save(orders);
  render();
}

let orderStatusFilter = 'all';
/* WHO PICKS THIS ORDER.
   Asked for on 16-09-2026: the picker should not be handed the whole
   day's work, and the shop wants to know afterwards who pulled what.
   CEO and dispatcher both set it; the picker only sees what is theirs. */
function assignOrder(orderId, phone){
  const o = orders.find(x=>x.id===orderId);
  if(!o) return;
  o.assignedTo = phone || null;
  for(const it of (o.items || [])){
    if(!it.done && it.aqty == null && !it.billed) delete it.assignedTo;
  }
  DB.save(orders);
  toast(phone ? (o.orderNo + ' → ' + nameOfPhone(phone)) : (o.orderNo + ' — koi ne nahi'));
  render();
}

/* -------- one order, more than one pair of hands --------
   A 180-line order is a morning for one person. It can be handed to two
   or three, and THE SPLIT FOLLOWS THE RACKS: the lines are already in
   walking order (locationSortedIndices), so each picker gets one
   contiguous stretch of the warehouse instead of the two of them
   crossing in every aisle. A line already picked stays with whoever
   picked it -- a re-split never moves finished work.

   Model: `o.assignedTo` is the order's picker, as before. A line may
   carry its own `it.assignedTo`, which wins. So a single-picker order
   needs nothing new, and a split order is just lines with owners. */
function itemOwner(o, it){
  return it.assignedTo || o.assignedTo || null;
}
function ownersOf(o){
  const seen = [];
  for(const it of (o.items || [])){
    const w = itemOwner(o, it);
    if(w && !seen.includes(w)) seen.push(w);
  }
  return seen;
}
function isSplit(o){
  return ownersOf(o).length > 1;
}
/* The lines that are THIS person's, in walking order. */
function myItemIdxs(o, phone){
  return locationSortedIndices(o).filter(i => String(itemOwner(o, o.items[i])) === String(phone));
}
/* "Raju 12/35" for every owner -- what the card shows. */
function ownerProgress(o){
  const m = new Map();
  for(const it of (o.items || [])){
    const w = itemOwner(o, it);
    if(!w) continue;
    const e = m.get(w) || {done:0, total:0};
    e.total++;
    if(it.done || it.billed || it.aqty != null) e.done++;
    m.set(w, e);
  }
  return [...m].map(([phone, e]) => ({phone, name: nameOfPhone(phone), ...e}));
}

function splitOrder(orderId, phones){
  const o = orders.find(x=>x.id===orderId);
  if(!o || !phones.length) return;
  // The whole point is dealing by RACK. Without the stock list there are
  // no racks, and the deal would quietly fall back to line order -- two
  // pickers crossing in every aisle, and nobody told. Refuse instead.
  if(!stockCache || !stockCache.length){
    toast('Stock list hju load nathi thai — 2 second pachi fari try karo.');
    return;
  }
  // Only lines nobody has finished are dealt out. Finished ones keep
  // their picker -- the name on them is the whole point.
  const open = locationSortedIndices(o).filter(i => {
    const it = o.items[i];
    return !it.billed && !it.done && it.aqty == null;
  });
  const n = phones.length;
  const per = Math.ceil(open.length / n);
  open.forEach((idx, k) => {
    o.items[idx].assignedTo = phones[Math.min(Math.floor(k / per), n - 1)];
  });
  o.assignedTo = phones[0];
  DB.save(orders);
  const words = ownerProgress(o).map(p => `${p.name} ${p.total}`).join(' · ');
  toast(o.orderNo + ' vahenchyo: ' + words);
  closeModal();
  render();
}

function closeModal(){ modalRoot.innerHTML = ''; }

async function openSplitSheet(orderId){
  const o = orders.find(x=>x.id===orderId);
  if(!o) return;
  if(!stockCache || !stockCache.length){
    toast('Stock list laavu chu…');
    await preloadStock();
  }
  const open = o.items.filter(it => !it.billed && !it.done && it.aqty == null).length;
  const owners = ownersOf(o);
  const people = pickersList();
  if(people.length < 2){
    alert('Vahenchva mate ochha ma ocha 2 picker joi ye. Manage Users ma umero.');
    return;
  }
  const rows = people.map(u => `
    <label class="split-row">
      <input type="checkbox" value="${esc(u.phone)}" ${owners.includes(String(u.phone)) ? 'checked' : ''}
        onchange="splitPreview('${o.id}')">
      <span class="nm">${esc(u.name || u.phone)}</span>
      <span class="cnt" id="split-cnt-${esc(u.phone)}"></span>
    </label>`).join('');
  modalRoot.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${esc(o.orderNo)} — kone kone kadhvanu?</h3>
        <div class="split-preview" id="split-preview"></div>
        <div class="split-list" id="split-list">${rows}</div>
        <button class="btn btn-primary" id="split-go" onclick="splitGo('${o.id}')">Vahencho</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>`;
  splitPreview(o.id);
}

function splitChosen(){
  return [...document.querySelectorAll('#split-list input:checked')].map(i => i.value);
}

function splitPreview(orderId){
  const o = orders.find(x=>x.id===orderId);
  const chosen = splitChosen();
  const open = o.items.filter(it => !it.billed && !it.done && it.aqty == null).length;
  const doneN = o.items.length - open;
  const n = chosen.length;
  const per = n ? Math.ceil(open / n) : 0;
  document.querySelectorAll('#split-list .cnt').forEach(el => el.textContent = '');
  chosen.forEach((ph, k) => {
    const share = Math.max(0, Math.min(per, open - k * per));
    const el = document.getElementById('split-cnt-' + ph);
    if(el) el.textContent = share + ' item';
  });
  const pv = document.getElementById('split-preview');
  const go = document.getElementById('split-go');
  if(!n){
    pv.innerHTML = `${open} item baki che. Kone apva te tick karo.`;
    go.disabled = true;
  } else {
    pv.innerHTML = `<b>${open} item</b> ${n} jan ma vahenchase — <b>rack na kram e</b>, etle dar ek ne
      godown no ek j bhaag male, ek-bija ni aade na aave.`
      + (doneN ? ` ${doneN} item pehla thi thai gaya che, te jem che tem rahese.` : '');
    go.disabled = false;
  }
}

function splitGo(orderId){
  const chosen = splitChosen();
  if(!chosen.length) return;
  splitOrder(orderId, chosen);
}

function stillToPick(o){
  return o.status === 'pending' || o.status === 'checking' || o.status === 'ready';
}

function assignControl(o){
  if(!stillToPick(o)) return '';
  const opts = pickersList().map(u =>
    `<option value="${esc(u.phone)}" ${String(o.assignedTo)===String(u.phone)?'selected':''}>${esc(u.name || u.phone)}</option>`
  ).join('');
  const open = (o.items || []).filter(it => !it.billed && !it.done && it.aqty == null).length;
  return `
    <div class="assign" onclick="event.stopPropagation()">
      <label>Kadhvanu:</label>
      <select onchange="assignOrder('${o.id}', this.value)">
        <option value="">— koi ne nahi —</option>
        ${opts}
      </select>
      ${open >= 2 && pickersList().length >= 2
        ? `<button class="btn-split" onclick="openSplitSheet('${o.id}')">&#8644; ${isSplit(o) ? 'fari vahencho' : '2 jan ma vahencho'}</button>`
        : ''}
    </div>`;
}

/* Every name that has touched this order's lines, so the card answers
   "aa saman kone kadhyu?" without opening it. */
function pickedByNames(o){
  const seen = [];
  for(const it of (o.items || [])){
    if(it.pickedBy && !seen.includes(it.pickedBy)) seen.push(it.pickedBy);
  }
  return seen;
}

function setOrderStatusFilter(s){
  orderStatusFilter = s;
  updateStatusChipStyles();
  filterOrderList();
}
function updateStatusChipStyles(){
  document.querySelectorAll('.status-chip').forEach(btn => {
    const active = btn.dataset.statusFilter === orderStatusFilter;
    btn.style.background = active ? 'var(--accent)' : 'var(--bg-raised)';
    btn.style.color = active ? '#FFFFFF' : 'var(--text)';
  });
}

function filterOrderList(){
  const q = (document.getElementById('order-search')?.value || '').trim().toLowerCase();
  const cards = document.querySelectorAll('#order-list-rows .order-card');
  let visibleCount = 0;
  cards.forEach(c => {
    const matchesText = !q || c.dataset.search.includes(q);
    const matchesStatus = orderStatusFilter === 'all' || c.dataset.status === orderStatusFilter;
    const match = matchesText && matchesStatus;
    c.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  let noResultEl = document.getElementById('order-search-noresult');
  if(visibleCount === 0){
    if(!noResultEl){
      noResultEl = document.createElement('div');
      noResultEl.id = 'order-search-noresult';
      noResultEl.className = 'empty';
      noResultEl.textContent = 'Koi order na malyu.';
      document.getElementById('order-list-rows').appendChild(noResultEl);
    }
  } else if(noResultEl){
    noResultEl.remove();
  }
}

/* -------- Order detail: packing check + recheck -------- */
function renderOrderDetail(id){
  const o = orders.find(x=>x.id===id);
  if(!o){ currentOrderId=null; render(); return; }

  document.getElementById('headerContent').innerHTML = `
    <div class="topbar">
      <button class="backbtn" onclick="goToOrder(null)">←</button>
      <div style="flex:1;">
        <div class="brand-name">${o.orderNo} — ${o.party}</div>
        <div class="brand-sub">${o.location ? o.location+' · ' : ''}${statusLabel(o.status)}</div>
      </div>
    </div>`;

  if(currentRole === 'picker'){
    // Picker only ever does blind packing entry. Once submitted, nothing
    // more to see here — ordered qty, mismatch and billing stay hidden.
    if(o.status === 'pending' || o.status === 'checking'){
      renderPackingCheck(o);
    } else {
      main.innerHTML = `<div class="empty">✓ Aa order submit thai gayu che. Dispatcher check karshe.</div>`;
    }
    return;
  }

  if(o.status === 'billed' || o.status === 'packed'){
    renderFinalBill(o);
    return;
  }
  if(o.status === 'ready'){
    renderRecheck(o);
    return;
  }
  renderPackingCheck(o);
}

let pickerIdx = 0; // which item index the picker is currently on

function renderPackingCheck(o){
  const blind = currentRole === 'picker';

  if(blind){
    renderPickerSingleItem(o);
    return;
  }

  // Full view (CEO/Dispatcher): ONE TABLE, not twenty cards.
  // Sorted by rack location so items are in walking order.
  const sortedIdxs = locationSortedIndices(o);
  const rows = sortedIdxs.map((idx, srNo)=>{
    const it = o.items[idx];
    const aq = it.aqty != null ? it.aqty : '';
    const ar = it.arate != null ? it.arate : '';
    const done = it.aqty != null;
    const gone = itemGone(it);
    const stk = stockLookup(it.code);
    return `
      <tr class="${rowClassFor(o, idx)}" id="row-${idx}"
          data-search="${esc((it.code+' '+(it.desc||'')).toLowerCase())}">
        <td>
          <div class="cd">${srNo+1}. ${esc(it.code)} ${mark(done)}${isSplit(o) && itemOwner(o, it) ? `<span class="own">${esc(nameOfPhone(itemOwner(o, it)))}</span>` : ''}</div>
          <div class="ds">${esc(it.desc || '')}</div>
          <div class="lc">&#128205; ${stk ? esc(stk.location || '—') : '—'} &middot; STOCK ${stk ? (stk.qty ?? '—') : '—'}</div>
          <div class="ordline">Ordered <b>${it.oqty}</b> &middot; MRP <b>${fmt(mrpOf(it))}</b></div>
          ${it.billed
            ? `<div class="who" style="color:var(--ok)"><b>&#10003; BILL MA AAVI GAYU</b> — fari na kadho</div>` : ''}
          ${gone
            ? `<div class="who" style="color:var(--bad)"><b>KADHYU NATHI</b>${it.pickedBy ? ' — ' + esc(it.pickedBy) : ''}</div>`
            : (done && it.pickedBy
               ? `<div class="who">Kadhyu: <b>${esc(it.pickedBy)}</b></div>` : '')}
          ${it.billed ? ''
            : gone
              ? `<button class="delbtn undo" onclick="undoDeleteItem('${o.id}', ${idx})">&#8617; pachhu lavo</button>`
              : `<button class="delbtn" onclick="deleteItem('${o.id}', ${idx})">&#10007; nathi aapyu</button>`}
        </td>
        <td><input inputmode="decimal" placeholder="${it.oqty}" value="${aq}" ${it.billed?'disabled':''}
              oninput="updateItem('${o.id}', ${idx}, 'aqty', this.value)"></td>
        <td><input inputmode="decimal" placeholder="${mrpOf(it)}" value="${ar}" ${it.billed?'disabled':''}
              oninput="updateItem('${o.id}', ${idx}, 'arate', this.value)"></td>
      </tr>`;
  }).join('');

  const billedN = o.items.filter(it=>it.billed).length;
  main.innerHTML = `
    <div class="field" style="margin-bottom:10px;">
      <input id="item-search" placeholder="Item code ya naam search karo..." oninput="filterItemRows()"
        style="width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; font-size:15px;">
    </div>
    ${billedN ? `<div class="status-banner" style="background:var(--ok-bg); border-color:#B9DFC4; color:var(--ok);">&#10003; ${billedN} item nu bill pehla thi bani gayu che — e lila ma che, fari na kadhso.</div>` : ''}
    <div class="legend">
      <span><i style="background:var(--wait-bg)"></i>Rate alag</span>
      <span><i style="background:#fff; box-shadow:inset 3px 0 0 var(--bad)"></i>Qty alag</span>
      <span><i style="background:var(--bad-bg)"></i>Kadhyu nathi</span>
      <span><i style="background:var(--ok-bg)"></i>Bill ma aavi gayu</span>
      <span>${mark(true)} thai gayu &middot; ${mark(false)} baki</span>
    </div>
    <div class="dwrap">
      <table class="dtable">
        <colgroup><col><col class="q"><col class="r"></colgroup>
        <thead><tr>
          <th>Item &middot; ordered &middot; MRP</th>
          <th class="n">Qty</th><th class="n">Rate</th>
        </tr></thead>
        <tbody id="item-rows-container">${rows}</tbody>
      </table>
    </div>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="finishPacking('${o.id}')">Packing Done &rarr; Recheck</button>
  `;
}

/* An item the shop did not supply. The phone writes qty 0 and Bill Maker
   does NOT put such a line on the bill -- it unticks it in Value-FAS's
   own popup, so the line stays a PENDING ORDER there and can still be
   billed when stock comes in. Deleting it off the phone entirely would
   lose that. */
function itemGone(it){
  return !!it.removed || (it.aqty != null && Number(it.aqty) === 0);
}

function rowClassFor(o, idx){
  const it = o.items[idx];
  const done = it.aqty != null;
  const gone = itemGone(it);
  return [
    it.billed ? 'billed-row' : '',
    gone ? 'gone' : '',
    (done && !gone && Number(it.arate) !== Number(mrpOf(it))) ? 'rate-diff' : '',
    (done && !gone && Number(it.aqty)  !== Number(it.oqty))   ? 'qty-diff'  : ''
  ].filter(Boolean).join(' ');
}

function whoAmI(){
  return currentName || currentPhone || 'Koi';
}

function deleteItem(orderId, idx){
  const o = orders.find(x=>x.id===orderId);
  const it = o.items[idx];
  if(it.billed){
    alert('Aa item nu bill pehla thi bani gayu che — have kadhi na shakay.');
    return;
  }
  if(!confirm(it.code + '\n\nAa item nathi aapyu? Qty 0 thai jase ane bill par nahi aave.')) return;
  it.aqty = 0;
  if(it.arate == null) it.arate = mrpOf(it);
  it.done = true;
  it.removed = true;
  it.pickedBy = whoAmI();
  if(o.status === 'pending') o.status = 'checking';
  DB.save(orders);
  toast(it.code + ' — kadhyu nathi (qty 0)');
  render();
}

function undoDeleteItem(orderId, idx){
  const o = orders.find(x=>x.id===orderId);
  const it = o.items[idx];
  it.removed = false;
  it.aqty = null;
  it.done = false;
  DB.save(orders);
  render();
}

function filterItemRows(){
  const q = (document.getElementById('item-search')?.value || '').trim().toLowerCase();
  const rows = document.querySelectorAll('#item-rows-container tr[data-search]');
  rows.forEach(r => {
    r.style.display = (!q || r.dataset.search.includes(q)) ? '' : 'none';
  });
}

function renderPickerSingleItem(o){
  // Only this picker's lines. On a split order that is their stretch of
  // the racks; on an ordinary one it is everything.
  const sortedIdxs = isSplit(o) ? myItemIdxs(o, currentPhone) : locationSortedIndices(o);
  // clamp to first not-done item (in location order) so a picker never re-does a finished one
  // Skip anything already done AND anything a bill has already taken --
  // those goods are out of the shop, picking them again is the mistake
  // this is here to stop.
  while(pickerIdx < sortedIdxs.length &&
        (o.items[sortedIdxs[pickerIdx]].done || o.items[sortedIdxs[pickerIdx]].billed)) pickerIdx++;

  if(pickerIdx >= sortedIdxs.length){
    // This picker is done. The ORDER is done only when every line is --
    // on a split order the other picker may still be out on the racks.
    const othersOpen = o.items.filter(it => !it.done && !it.billed && it.aqty == null
                                      && String(itemOwner(o, it)) !== String(currentPhone)).length;
    if(othersOpen){
      const who = ownerProgress(o).filter(p => String(p.phone) !== String(currentPhone) && p.done < p.total)
                    .map(p => `${p.name} (${p.total - p.done} baki)`).join(', ');
      main.innerHTML = `<div class="empty">&#10003; Tamara ${sortedIdxs.length} item thai gaya.<br><br>
        Hju ${othersOpen} item bija pase che: ${esc(who)}.<br>Te puru thase etle order aagal jase.</div>`;
      if(o.status === 'pending'){ o.status = 'checking'; DB.save(orders); }
      return;
    }
    main.innerHTML = `<div class="empty">&#10003; Badha item puru thai gaya. Submit thai rahyu che...</div>`;
    finishPacking(o.id);
    return;
  }

  const realIdx = sortedIdxs[pickerIdx];
  const it = o.items[realIdx];
  const total = sortedIdxs.length;
  const stk = stockLookup(it.code);
  main.innerHTML = `
    <div class="status-banner">Item ${pickerIdx+1} of ${total}${isSplit(o) ? ' (tamara)' : ''} — Ordered Qty joi ne Actual Qty/Rate bharo.</div>
    <div class="item-row" id="row-${realIdx}">
      <div class="item-top">
        <div>
          <div class="item-code">${it.code}</div>
          <div class="item-desc">${it.desc}</div>
          ${stk ? `<div class="loc-line">📍 ${stk.location || '—'}<span class="loc-stock">STOCK ${stk.qty ?? '—'}</span></div>` : ''}
        </div>
      </div>
      <div class="item-grid">
        <div class="field">
          <label>ORDERED QTY</label>
          <div class="readonly">${it.oqty}</div>
        </div>
        <div class="field">
          <label>MRP</label>
          <div class="readonly">${fmt(mrpOf(it))}</div>
        </div>
        <div class="field">
          <label>ACTUAL QTY</label>
          <input id="picker-qty" inputmode="decimal" placeholder="${it.oqty}">
        </div>
        <div class="field">
          <label>ACTUAL RATE</label>
          <input id="picker-rate" inputmode="decimal" placeholder="${mrpOf(it)}">
        </div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="confirmPickerItem('${o.id}', ${realIdx})">&#10003; Aa Item Thai Gayu — Next</button>
    <button class="btn" style="margin-top:9px; color:var(--bad); border-color:#F3B9B6; background:var(--bad-bg);"
      onclick="pickerSkipItem('${o.id}', ${realIdx})">&#10007; Aa item nathi aapyu — 0 karo</button>
    <div class="fab-note">0 karso toh aa line bill par nahi aave, ane Value-FAS ma
      pending order tarike ubhi rahese — stock aave tyare bill thai shakse.</div>
  `;
}

function pickerSkipItem(orderId, idx){
  const o = orders.find(x=>x.id===orderId);
  const it = o.items[idx];
  if(!confirm(it.code + '\n\nAa item nathi aapyu? Qty 0 thai jase.')) return;
  it.aqty = 0;
  it.arate = mrpOf(it);
  it.done = true;
  it.removed = true;
  it.pickedBy = whoAmI();
  if(o.status === 'pending') o.status = 'checking';
  DB.save(orders);
  pickerIdx++;
  render();
}

function confirmPickerItem(orderId, idx){
  const o = orders.find(x=>x.id===orderId);
  const it = o.items[idx];
  const qtyVal = document.getElementById('picker-qty').value;
  const rateVal = document.getElementById('picker-rate').value;
  it.aqty = qtyVal === '' ? it.oqty : Number(qtyVal);
  it.arate = rateVal === '' ? mrpOf(it) : Number(rateVal);
  it.done = true;
  it.removed = Number(it.aqty) === 0;
  it.pickedBy = whoAmI();
  if(o.status === 'pending') o.status = 'checking';
  DB.save(orders);
  pickerIdx++;
  render();
}

function updateItem(orderId, idx, field, value){
  const o = orders.find(x=>x.id===orderId);
  const it = o.items[idx];
  it[field] = value === '' ? null : Number(value);
  // WHO TOUCHED THIS LINE. The picker's screen already recorded it; the
  // dispatcher's did not, so a line changed here used to have no name
  // against it at all.
  if(it.aqty != null){
    it.done = true;
    it.pickedBy = whoAmI();
    if(Number(it.aqty) !== 0) it.removed = false;
  } else {
    it.done = false;
  }
  if(o.status === 'pending') o.status = 'checking';
  DB.save(orders);
  // Repaint the row's colours in place -- NOT a re-render, which would
  // take the keyboard away mid-number.
  const rowEl = document.getElementById(`row-${idx}`);
  if(rowEl) rowEl.className = rowClassFor(o, idx);
}

function finishPacking(orderId){
  const o = orders.find(x=>x.id===orderId);
  // fill blanks with ordered values
  o.items.forEach(it=>{
    if(it.aqty===null) it.aqty = it.oqty;
    if(it.arate===null) it.arate = mrpOf(it);
  });
  o.status = 'ready';
  DB.save(orders);
  render();
}

function renderRecheck(o){
  const rows = o.items.map(it=>{
    const qtyMismatch = it.aqty != null && Number(it.aqty) !== Number(it.oqty);
    const rateMismatch = it.arate != null && Number(it.arate) !== Number(mrpOf(it));
    const gone = itemGone(it);
    // Same rule as the dispatcher's table: yellow means the RATE is not
    // the stock rate, red means the QUANTITY is not what was ordered.
    const cls = gone ? 'mismatch' : (qtyMismatch ? 'mismatch' : (rateMismatch ? 'rate-diff' : ''));
    return `
      <div class="recheck-row ${cls}">
        <div class="desc">${esc(it.desc || '')}<div class="code">${esc(it.code)}</div>
          ${gone ? `<div class="who" style="color:var(--bad); font-weight:700;">&#10007; KADHYU NATHI</div>` : ''}
          ${it.pickedBy ? `<div class="who">Kadhyu: <b>${esc(it.pickedBy)}</b></div>` : ''}
        </div>
        <div>
          <div class="colhead">QTY</div>
          <div class="num ${qtyMismatch?'diff':''}">${it.oqty} → ${it.aqty}</div>
        </div>
        <div>
          <div class="colhead">RATE</div>
          <div class="num ${rateMismatch?'diff':''}">${fmt(mrpOf(it))} → ${fmt(it.arate)}</div>
        </div>
      </div>`;
  }).join('');

  // A line nobody supplied is not going on the bill, so it is not in the
  // total either -- it used to be counted at its ORDERED quantity. And
  // the rate used is the one that will be billed, not always the MRP.
  const total = o.items.reduce((s,it)=> itemGone(it) ? s
      : s + Number(it.aqty ?? it.oqty ?? 0) * Number(it.arate ?? mrpOf(it)), 0);
  const mismatchCount = o.items.filter(it=>
    (it.aqty != null && Number(it.aqty)!==Number(it.oqty)) ||
    (it.arate != null && Number(it.arate)!==Number(mrpOf(it)))).length;

  main.innerHTML = `
    <div class="status-banner">${mismatchCount ? '&#9888; '+mismatchCount+' item ma Ordered ane Actual alag che — bill banavta pehla ek var joi levu.' : '&#10003; Badha item Ordered mujab j che.'}</div>
    ${(() => { const g = o.items.filter(itemGone).length; return g
        ? `<div class="status-banner" style="background:var(--bad-bg); border-color:#F3B9B6; color:var(--bad);">&#10007; ${g} item kadhyu nathi — te bill par nahi aave, ane Value-FAS ma pending rahese.</div>` : ''; })()}
    <div class="legend">
      <span><i style="background:var(--wait-bg)"></i>Rate alag</span>
      <span><i style="background:var(--bad-bg)"></i>Qty alag / kadhyu nathi</span>
    </div>
    ${rows}
    <div class="summary-card">
      <div class="summary-line total"><span>Final Bill Amount</span><span class="val">₹ ${fmt(total)}</span></div>
    </div>
    ${currentRole === 'ceo'
      ? `<button class="btn btn-primary" onclick="confirmBill('${o.id}')">Confirm &amp; Bill Maker ma mokalo</button>`
      : `<div class="fab-note">Matra CEO j bill confirm kari shake che.</div>`}
    <button class="btn btn-ghost" onclick="backToPacking('${o.id}')">← Back, edit qty/rate</button>
  `;
}

function backToPacking(orderId){
  const o = orders.find(x=>x.id===orderId);
  o.status = 'checking';
  DB.save(orders);
  render();
}

function confirmBill(orderId){
  // OrderFlow does NOT make the bill. It hands the packed order over to
  // Bill Maker, and the bill is made only when somebody picks it there
  // and taps "Make Bills".
  //
  // This used to set status 'billed' with fas_entry_started false --
  // which is exactly the signal the PC watches for. So confirming here
  // fired a bill off immediately, behind the CEO's back.
  const o = orders.find(x=>x.id===orderId);
  o.status = 'packed';
  o.packedAt = new Date().toISOString();
  DB.save(orders);
  render();
}

function renderFinalBill(o){
  const rows = o.items.map(it=>`
    <div class="recheck-row ${itemGone(it)?'mismatch':''}">
      <div class="desc">${esc(it.desc || '')}<div class="code">${esc(it.code)}</div>
        ${itemGone(it) ? `<div class="who" style="color:var(--bad); font-weight:700;">&#10007; KADHYU NATHI</div>` : ''}
        ${it.pickedBy ? `<div class="who">Kadhyu: <b>${esc(it.pickedBy)}</b></div>` : ''}
      </div>
      <div><div class="colhead">QTY</div><div class="num">${it.aqty}</div></div>
      <div><div class="colhead">AMOUNT</div><div class="num">${itemGone(it) ? '—' : fmt((it.aqty ?? it.oqty ?? 0)*Number(it.arate ?? mrpOf(it)))}</div></div>
    </div>`).join('');
  // A line nobody supplied is not going on the bill, so it is not in the
  // total either -- it used to be counted at its ORDERED quantity. And
  // the rate used is the one that will be billed, not always the MRP.
  const total = o.items.reduce((s,it)=> itemGone(it) ? s
      : s + Number(it.aqty ?? it.oqty ?? 0) * Number(it.arate ?? mrpOf(it)), 0);

  main.innerHTML = `
    <div class="status-banner" style="background:var(--ok-bg); border-color:#B9DFC4; color:var(--ok);">✓ Bill Maker ma mokli didhu. Bill tya thi select karsho tyare j banse.</div>
    ${rows}
    <div class="summary-card">
      <div class="summary-line total"><span>Net Amount</span><span class="val">₹ ${fmt(total)}</span></div>
    </div>
    ${currentRole==='ceo' ? `<button class="btn btn-ghost" onclick="resetToPending('${o.id}')">↺ Reset to Pending (galti thi Billed thayu hoy to)</button>` : ''}
  `;
}

function resetToPending(orderId){
  if(!confirm('Aa order pacho "Pending" ma levo che? Value-FAS ma bill banavyu hoy to e alag thi delete karvu padse.')) return;
  const o = orders.find(x=>x.id===orderId);
  if(!o) return;
  o.status = 'pending';
  o.fasEntryStarted = false;
  DB.save(orders);
  currentOrderId = null;
  render();
}

/* -------- Add order manually removed: all orders now come
   automatically from Value-FAS via the sync script. -------- */

async function syncNowOnLoad(){
  if(!FIREBASE_CONFIGURED || !currentRole) return;
  const remote = await pullFromSupabase();
  if(remote === null) return;
  orders = sortOrders(remote);
  localStorage.setItem('orderflow_orders_v2', JSON.stringify(orders));
  if(!currentOrderId) render();
}

function locationSortedIndices(o){
  // Sort item indices by rack Location (stock lookup) so a picker walks
  // the warehouse in order instead of jumping around. Items with no
  // known location sort to the end.
  const idxs = o.items.map((_, i) => i);
  idxs.sort((a, b) => {
    const la = stockLookup(o.items[a].code)?.location || '';
    const lb = stockLookup(o.items[b].code)?.location || '';
    if(!la && !lb) return a - b;
    if(!la) return 1;
    if(!lb) return -1;
    return la.localeCompare(lb);
  });
  return idxs;
}

function mrpOf(it){
  // The item's real MRP is ItemMast.SRate, which reaches us on the STOCK
  // record as `rate`. What the order carries in `it.mrp` is actually
  // InvTran.NetRate -- the rate this party is billed at AFTER their
  // discount -- so it is not the printed price and must not be labelled
  // MRP. Fall back to it only when the item is not in the stock cache.
  const s = stockLookup(it.code);
  const r = s ? Number(s.rate) : 0;
  return (r > 0) ? r : Number(it.mrp ?? 0);
}

function stockLookup(code){
  if(!stockCache) return null;
  return stockCache.find(s => s.code === code) || null;
}

async function preloadStock(){
  if(stockCache) return;
  // Cache in localStorage for 15 min -- the stock catalog can be
  // thousands of docs, and re-fetching all of it on every single page
  // load across every phone is what burns through the Firestore free
  // read quota in a single afternoon.
  const CACHE_KEY = 'orderflow_stock_cache';
  const CACHE_MS = 2 * 60 * 1000;
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Date.now() - parsed.ts < CACHE_MS){
        stockCache = parsed.data;
        return;
      }
    }
  }catch(e){}
  stockCache = await fetchAllStock();
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts: Date.now(), data: stockCache})); }catch(e){}
}

render();
syncNowOnLoad();
preloadStock();
preloadUsers().then(()=>{ if(currentRole) render(); });
startLiveSync();
// One history entry to sit on, so the very first Back press has
// something to pop instead of closing the app.
armBack();
</script>

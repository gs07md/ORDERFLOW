<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OrderFlow — Shree Giriraj Auto Parts</title>
<style>
  :root{
    --bg: #F6F7F9;
    --bg-panel: #FFFFFF;
    --bg-raised: #F2F4F7;
    --line: #E3E6EA;
    --text: #16181D;
    --text-dim: #6B7280;
    --accent: #2F5FDE;
    --accent-dim: #E8EEFD;
    --ok: #1E8E5A;
    --ok-bg: #E6F4EA;
    --bad: #D6433D;
    --bad-bg: #FCEAEA;
    --wait-bg: #FDF3DA;
    --wait: #B07C13;
    --radius: 10px;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  body{ padding-bottom:84px; min-height:100vh; }
  h1,h2,h3{ margin:0; font-weight:600; }
  .app-header{
    position:sticky; top:0; z-index:20;
    background:var(--bg); border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:32px; height:32px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; color:#FFFFFF; font-size:15px; flex:none; }
  .brand-name{ font-size:15px; font-weight:600; letter-spacing:.2px; }
  .brand-sub{ font-size:11.5px; color:var(--text-dim); margin-top:1px; }
